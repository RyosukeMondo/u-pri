[project]
name = "upri-bridge"
version = "0.1.0"
description = "Local REST bridge for Yu-Pack Print R CSV exchange"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "reportlab>=4,<5",
    "uvicorn>=0.30,<1",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
